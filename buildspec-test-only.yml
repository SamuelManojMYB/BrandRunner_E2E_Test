# Two-stage alternative to buildspec.yml: pulls an already-built, already-pushed
# ECR image and only RUNS the API suite - no Docker build/push. Use this on a
# separate CodeBuild project for routine/scheduled test executions once an image
# has been published by buildspec.yml, so day-to-day runs skip the full multi-
# minute Maven dependency resolution + whole-project compile every time. See
# docs/AWS_CODEBUILD.md's "Two-stage alternative" section for when to use this.
#
# Required CodeBuild project environment variables (plain, non-secret):
#   AWS_ACCOUNT_ID, AWS_DEFAULT_REGION, ECR_REPOSITORY
#   API_BASE_URL, API_TENANT
#   IMAGE_TAG - which already-pushed tag to run (defaults to "latest" if unset)
#
# Required CodeBuild project secrets, injected from SSM Parameter Store:
#   API_USERNAME, API_PASSWORD

version: 0.2

env:
  parameter-store:
    API_USERNAME: "/brandrunner/qa/automation/username"
    API_PASSWORD: "/brandrunner/qa/automation/password"

phases:
  install:
    runtime-versions:
      docker: 20

  pre_build:
    commands:
      - echo "Authenticating to Amazon ECR..."
      - ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - IMAGE_TAG="${IMAGE_TAG:-latest}"
      - echo "Pulling image tag $IMAGE_TAG"
      - docker pull "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  build:
    commands:
      - echo "Running API automation suite in a container of the pulled image..."
      - >
        CONTAINER_ID=$(docker create
        -e API_BASE_URL="$API_BASE_URL"
        -e API_TENANT="$API_TENANT"
        -e API_USERNAME="$API_USERNAME"
        -e API_PASSWORD="$API_PASSWORD"
        "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG");
        docker start -a "$CONTAINER_ID";
        TEST_EXIT_CODE=$?;
        mkdir -p target/surefire-reports;
        docker cp "$CONTAINER_ID":/app/target/surefire-reports/. target/surefire-reports/ || true;
        docker rm "$CONTAINER_ID" > /dev/null;
        exit $TEST_EXIT_CODE

reports:
  brandrunner-api-suite:
    files:
      - "testng-results.xml"
    base-directory: "target/surefire-reports"
    file-format: "TESTNGXML"

artifacts:
  files:
    - "target/surefire-reports/**/*"
