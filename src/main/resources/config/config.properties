projectName = Vendor Invoice Management Project
environment = qa

# Environment configuration
# api.base.url/api.tenant target the BrandRunners Web API (source of truth: the
# "BrandRunners Web APIs" Postman collection). No API test previously depended on
# the old IFC value below - the API suite had zero tests until now.
# Previous IFC value, kept for reference: https://tgifcappdev.azurewebsites.net/backend/
api.base.url=https://maggie.qas.brandrunners.ai/api
api.tenant=maggie.qas
api.version=v1

# Performance settings
performance.threads=50
performance.ramp.up.seconds=30
performance.hold.duration.minutes=5
performance.threshold.response.time.ms=500

#UI settings
ui.url=https://maggie.qas.brandrunners.ai/
ui.browser=chrome

# Onboarding Portal UI (see ConfigManager.getOnboardingUi*). ONBOARDING_UI_* env vars and
# -Donboarding.ui.* system properties override these. Credentials are NOT kept here
# (see credentials.properties / ONBOARDING_UI_USERNAME, ONBOARDING_UI_PASSWORD).
# Browser and headless fall back to ui.browser / UI_HEADLESS when not set.
onboarding.ui.url=https://qas-onboarding.brandrunners.ai/
#onboarding.ui.browser=chrome
#onboarding.ui.headless=true
